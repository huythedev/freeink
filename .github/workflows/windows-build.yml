name: Windows installers (test build)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test editor and desktop lifecycle
        run: npm test
      - name: Build EXE and MSI without publishing
        env:
          FREEINK_GITHUB_REPO: huythedev/freeink
        run: npm run release:win
      - name: Validate installers
        shell: pwsh
        run: |
          if (-not @(Get-ChildItem dist -Filter '*.exe' -File).Count) { throw 'EXE not built' }
          if (-not @(Get-ChildItem dist -Filter '*.msi' -File).Count) { throw 'MSI not built' }
      - name: Verify Windows file associations
        shell: pwsh
        run: ./scripts/verify-windows-association.ps1
      - name: Upload Windows test installers
        uses: actions/upload-artifact@v4
        with:
          name: FreeInk-Windows-EXE-and-MSI
          path: |
            dist/*.exe
            dist/*.msi
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 7
