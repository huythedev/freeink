name: Publish Windows release (EXE + MSI)
run-name: Release FreeInk v${{ inputs.version }}

# Select this workflow in Actions, click Run workflow and enter a version.
# Only manual runs publish releases. A tag push alone will not publish twice.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0 for the first release, then 0.2.1)'
        required: true
        type: string
        default: '0.2.0'

permissions:
  contents: write

concurrency:
  group: freeink-windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Check out main and tags
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reject existing release tags
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          if (git tag --list $tag) { throw "Tag $tag already exists. Enter a new version." }
          if ($env:RELEASE_VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Use a stable version such as 0.2.1' }

      - name: Set version in package.json
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/prepare-release.cjs

      - name: Install dependencies and create lockfile
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build both EXE and MSI without publishing
        env:
          FREEINK_GITHUB_REPO: ${{ github.repository }}
          FREEINK_RELEASE_VERSION: ${{ inputs.version }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run release:win

      - name: Verify both installers and updater manifest
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem dist -Filter '*.exe' -File)
          $msi = @(Get-ChildItem dist -Filter '*.msi' -File)
          if ($exe.Count -lt 1) { throw 'Missing NSIS .exe installer' }
          if ($msi.Count -lt 1) { throw 'Missing MSI installer' }
          if (-not (Test-Path dist/latest.yml)) { throw 'Missing latest.yml; the in-app updater would not work' }
          Get-ChildItem dist -File | Select-Object Name, Length | Format-Table -AutoSize

      # No commit, tag or draft is created until BOTH packages have built.
      - name: Commit version to main and create tag
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: release FreeInk v$env:RELEASE_VERSION"
            git push origin HEAD:main
          }
          $tag = "v$env:RELEASE_VERSION"
          git tag -a $tag -m "FreeInk $tag"
          git push origin $tag

      - name: Create draft and upload installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          gh release create $tag --draft --title "FreeInk $tag" --generate-notes
          $files = @(Get-ChildItem dist -File | Where-Object {
            $_.Extension -in @('.exe', '.msi', '.blockmap') -or $_.Name -eq 'latest.yml'
          } | ForEach-Object { $_.FullName })
          gh release upload $tag $files
          if ($LASTEXITCODE -ne 0) { throw 'GitHub asset upload failed' }
          $assets = @(gh release view $tag --json assets --jq '.assets[].name')
          if (-not @($assets | Where-Object { $_ -like '*.exe' }).Count) { throw 'Release missing EXE' }
          if (-not @($assets | Where-Object { $_ -like '*.msi' }).Count) { throw 'Release missing MSI' }
          if ('latest.yml' -notin $assets) { throw 'Release missing latest.yml' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release; draft remains available for recovery' }
          Write-Host "Published $tag with EXE, MSI, and updater metadata"
