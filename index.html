<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>FreeInk — handwritten notes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-update" viewBox="0 0 24 24"><path d="M20 7V3h-4M20 3l-5 5a7 7 0 1 0 2 8M4 17v4h4M4 21l5-5"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-2"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h2"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M4 4h13l3 3v13H4zM7 4v6h10V4M7 20v-7h10v7"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="m4 20 5.4-1.2L20 8.2 15.8 4 5.2 14.6 4 20ZM13.5 6.3l4.2 4.2"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20 9 18.5 20 7.5 16.5 4 5.5 15ZM14.3 6.2l3.5 3.5"/><path d="m5.5 15 3.5 3.5"/></symbol>
    <symbol id="i-highlighter" viewBox="0 0 24 24"><path d="m5 14 8.5-9 5.5 5.5-8.5 9H5v-5.5ZM3 22h18M13.5 5l5.5 5.5"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m4 14 9-10a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-8 8H8l-4-4a1.5 1.5 0 0 1 0-2ZM10 9l8 8M13 20h8"/></symbol>
    <symbol id="i-lasso" viewBox="0 0 24 24"><path d="M8 17c-5-1-6-7-2-11 4-4 13-2 14 4s-6 9-11 7-1-5 2-4c3 2-1 6-1 8" stroke-dasharray="3 2"/></symbol>
    <symbol id="i-shape" viewBox="0 0 24 24"><path d="M3 3h9v9H3zM16 5a4 4 0 1 1 0 8 4 4 0 0 1 0-8ZM13 20l4-6 4 6z"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 6V4h16v2M12 4v16M8 20h8"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 12V6a1.5 1.5 0 0 1 3 0v5-7a1.5 1.5 0 0 1 3 0v7-6a1.5 1.5 0 0 1 3 0v7-4a1.5 1.5 0 0 1 3 0v7c0 5-3 7-8 7-3 0-5-3-7-7l-1-2a1.5 1.5 0 0 1 2-2l2 1"/></symbol>
    <symbol id="i-ruler" viewBox="0 0 24 24"><path d="m3 17 14-14 4 4L7 21zM11 9l3 3M8 12l2 2M14 6l2 2"/></symbol>
    <symbol id="i-paper" viewBox="0 0 24 24"><path d="M6 2h9l4 4v16H6zM15 2v5h4M9 12h7M9 16h7"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m4 18 6-6 4 4 3-3 4 4"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 2h9l4 4v16H6zM15 2v5h4M9 12h7M9 16h5"/></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 3v13M7 11l5 5 5-5M4 17v4h16v-4"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M16 8V4H4v12h4"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5c-3-2-7-2-10-1v15c4-1 8-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1ZM12 5v15"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></symbol>
    <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6M6 10h8M10 6v8"/></symbol>
    <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6M6 10h8"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20m-14-6 4-4 4 4m-8 12 4 4 4-4M6 8l-4 4 4 4m12-8 4 4-4 4"/></symbol>
  </svg>
  <div id="app">
    <header class="app-topbar">
      <div class="top-left">
        <button class="icon-button top-control" id="gallery-toggle" title="Notebook gallery" data-i18n-title="Notebook gallery" aria-label="Toggle gallery" data-i18n-aria="Toggle gallery"><svg><use href="#i-menu"/></svg></button>
        <div class="app-logo" title="FreeInk — free handwriting"><span class="logo-mark">f<span>.</span></span><span class="app-name">FreeInk</span></div>
        <span class="header-divider"></span>
        <button class="icon-button top-control" id="new-note" title="New note (Ctrl+N)" data-i18n-title="New note (Ctrl+N)"><svg><use href="#i-plus"/></svg></button>
        <button class="icon-button top-control" id="save-note" title="Save note (Ctrl+S)" data-i18n-title="Save note (Ctrl+S)"><svg><use href="#i-save"/></svg></button>
        <button class="icon-button top-control" id="undo" title="Undo (Ctrl+Z)" data-i18n-title="Undo (Ctrl+Z)"><svg><use href="#i-undo"/></svg></button>
        <button class="icon-button top-control" id="redo" title="Redo (Ctrl+Y)" data-i18n-title="Redo (Ctrl+Y)"><svg><use href="#i-redo"/></svg></button>
      </div>
      <div class="top-middle"><input id="note-title" aria-label="Note title" data-i18n-aria="Note title" value="Untitled note" spellcheck="false"><span class="saved-indicator" id="saved-indicator"><span class="saved-dot"></span> Saved</span></div>
      <div class="top-right">
        <label class="lang-control" title="Language / Ngôn ngữ"><span data-i18n="Language">Language</span><select id="language-select" aria-label="Language / Ngôn ngữ"><option value="en">EN</option><option value="vi">VI</option></select></label>
        <button class="text-button guide-button" id="guide-btn" type="button" data-i18n-title="User guide" title="User guide"><svg><use href="#i-book"/></svg><span data-i18n="Guide">Guide</span></button>
        <button class="text-button update-button" id="update-btn" title="Check for updates from GitHub Releases" data-i18n-title="Check for updates from GitHub Releases"><svg><use href="#i-update"/></svg><span id="update-label" data-i18n="Updates">Updates</span></button>
        <button class="text-button" id="import-btn" title="Import image, PDF, DOCX or FreeInk note" data-i18n-title="Import image, PDF, DOCX or FreeInk note"><svg><use href="#i-file"/></svg><span data-i18n="Import">Import</span></button>
        <button class="primary-button" id="export-btn" title="Export note" data-i18n-title="Export note"><svg><use href="#i-export"/></svg><span data-i18n="Export">Export</span><svg class="chevron"><use href="#i-chevron"/></svg></button>
        <button class="icon-button" id="options-btn" title="More options" data-i18n-title="More options"><svg><use href="#i-dots"/></svg></button>
      </div>
    </header>

    <div id="operation-status" class="operation-status" role="status" aria-live="polite" hidden>
      <span id="operation-label"></span><progress id="operation-progress" max="1"></progress>
      <button id="operation-cancel" class="text-button" type="button" data-i18n="Cancel">Cancel</button>
    </div>
    <div class="workspace">
      <aside id="sidebar" class="sidebar" aria-label="Note gallery">
        <div class="sidebar-heading"><div><div class="eyebrow" data-i18n="YOUR WORKSPACE">YOUR WORKSPACE</div><h2 data-i18n="My notes">My notes</h2></div><button class="icon-button" id="sidebar-close" title="Close gallery" data-i18n-title="Close gallery"><svg><use href="#i-close"/></svg></button></div>
        <button id="sidebar-new" data-language-control="1" class="create-note"><svg><use href="#i-plus"/></svg> <span data-i18n="New notebook page">New notebook page</span></button>
        <div class="search-wrap"><svg><use href="#i-search"/></svg><input id="note-search" placeholder="Search notes..." data-i18n-placeholder="Search notes..." aria-label="Search notes" data-i18n-aria="Search notes"/></div>
        <div class="sidebar-section"><span data-i18n="ALL NOTES">ALL NOTES</span><span id="notes-count">0</span></div>
        <div class="note-list" id="note-list"></div>
        <div class="sidebar-foot"><span class="local-dot"></span> <span data-i18n="Saved locally on this device">Saved locally on this device</span> <div data-i18n="Free forever · No account needed">Free forever · No account needed</div></div>
      </aside>
      <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
      <main class="editor">
        <div class="ribbon" role="toolbar" aria-label="Drawing toolbar">
          <div class="ribbon-tools">
            <button data-tool="pen" class="tool-button active" title="Pen (P)" data-i18n-title="Pen (P)"><svg><use href="#i-pen"/></svg><span data-i18n="Pen">Pen</span></button>
            <button data-tool="pencil" class="tool-button" title="Pencil (K)" data-i18n-title="Pencil (K)"><svg><use href="#i-pencil"/></svg></button>
            <button data-tool="highlighter" class="tool-button" title="Highlighter (H)" data-i18n-title="Highlighter (H)"><svg><use href="#i-highlighter"/></svg></button>
            <button data-tool="eraser" class="tool-button" title="Erase object (E)" data-i18n-title="Erase object (E)"><svg><use href="#i-eraser"/></svg></button>
        <button data-tool="pixel-eraser" class="tool-button" title="Pixel eraser (Shift+E)" aria-label="Pixel eraser" data-i18n-title="Pixel eraser (Shift+E)" data-i18n-aria="Pixel eraser"><svg><use href="#i-eraser"/><circle cx="18" cy="18" r="3" fill="currentColor" stroke="none"/></svg></button>
            <span class="ribbon-divider"></span>
            <button data-tool="lasso" class="tool-button" title="Lasso select (L)" data-i18n-title="Lasso select (L)"><svg><use href="#i-lasso"/></svg></button>
            <button data-tool="shape" class="tool-button" title="Shapes (S)" data-i18n-title="Shapes (S)"><svg><use href="#i-shape"/></svg></button>
            <button data-tool="text" class="tool-button" title="Text (T)" data-i18n-title="Text (T)"><svg><use href="#i-text"/></svg></button>
            <button data-tool="hand" class="tool-button" title="Hand / pan (Space)" data-i18n-title="Hand / pan (Space)"><svg><use href="#i-hand"/></svg></button>
            <span class="ribbon-divider"></span>
            <button class="tool-button" id="ruler-toggle" title="Toggle ruler" data-i18n-title="Toggle ruler"><svg><use href="#i-ruler"/></svg></button>
          </div>
          <span class="ribbon-divider ribbon-responsive"></span>
          <div class="colors" id="color-palette" aria-label="Ink colors" data-i18n-aria="Ink colors"></div>
          <input id="custom-color" class="color-input" type="color" value="#3e4656" aria-label="Custom ink color" title="Choose custom color" data-i18n-title="Choose custom color" />
          <div class="ribbon-grow"></div>
          <div class="stroke-width-wrap"><span class="width-icon" id="width-preview"></span><input id="stroke-width" type="range" min="1" max="24" value="3" aria-label="Ink thickness" data-i18n-aria="Ink thickness" title="Stroke width" data-i18n-title="Stroke width"/><span class="width-value" id="width-value">3</span></div>
          <span class="ribbon-divider"></span>
          <button class="tool-button paper-btn" id="template-btn" title="Choose paper template" data-i18n-title="Choose paper template"><svg><use href="#i-paper"/></svg><span data-i18n="Paper">Paper</span><svg class="mini-chevron"><use href="#i-chevron"/></svg></button>
        </div>
        <div class="document-area" id="document-area">
          <div class="pages" id="pages"></div>
          <div class="end-of-pages"><button id="add-page" data-language-control="1" class="add-page"><svg><use href="#i-plus"/></svg> <span data-i18n="Add page">Add page</span></button><span data-i18n="Keep your ideas flowing">Keep your ideas flowing</span></div>
        </div>
        <footer class="statusbar">
          <div class="status-left"><span class="status-ready"><span></span> Ready to ink</span><span class="status-divider"></span><span id="page-status">Page 1 of 1</span><span class="status-divider"></span><span id="template-status">Ruled paper</span></div>
          <div class="status-right"><span data-i18n="Scroll to navigate">Scroll to navigate</span><span class="status-divider"></span><button id="zoom-out" class="icon-button compact" title="Zoom out" data-i18n-title="Zoom out"><svg><use href="#i-zoom-out"/></svg></button><span id="zoom-display">100%</span><button id="zoom-in" class="icon-button compact" title="Zoom in" data-i18n-title="Zoom in"><svg><use href="#i-zoom-in"/></svg></button><button class="zoom-fit" id="zoom-fit" data-i18n-title="Fit page width" title="Fit page width"><span data-i18n="Fit">Fit</span></button></div>
        </footer>
      </main>
    </div>
  </div>
  <div id="popup-layer"></div>
  <div id="toast" role="status" class="toast"></div>
  <input type="file" id="file-import" accept=".pdf,.docx,.json,.freeink,.png,.jpg,.jpeg,.webp,.gif" hidden/>
  <input type="file" id="image-import" accept="image/*" hidden/>
  <script src="i18n.js" defer></script>
  <script src="runtime.js" defer></script>
  <script src="storage.js" defer></script>
  <script src="ink-engine.js" defer></script>
  <script src="vector-pdf.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
